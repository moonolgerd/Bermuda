name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*.*']
  pull_request:
    branches: [main]

jobs:
  # ─── Build, lint, unit tests ──────────────────────────────────────────────
  build:
    name: Build & test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install frontend deps
        working-directory: src/Bermuda.Web
        run: pnpm install --frozen-lockfile

      - name: Build .NET solution
        run: dotnet build Bermuda.slnx --configuration Release

      - name: .NET unit tests
        run: dotnet test Bermuda.slnx --configuration Release --no-build

      - name: Lint
        working-directory: src/Bermuda.Web
        run: pnpm lint

      - name: Frontend unit tests
        working-directory: src/Bermuda.Web
        run: pnpm test --run --passWithNoTests

      - name: Build frontend
        working-directory: src/Bermuda.Web
        run: pnpm build

      # The MSIX job only packs. `dotnet build` is framework-dependent, so a version tag
      # also publishes the self-contained win-x64 app and hands that folder across.
      - name: Publish self-contained app
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/Bermuda/Bermuda.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish -p:PublishSingleFile=false -p:PublishReadyToRun=false

      # The native side apps listed in fdc3-appd.json ship inside Bermuda's MSIX as more applications, so they
      # are published into the same folder (shared runtime/library files are identical).
      - name: Publish self-contained native apps into the same folder
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet msbuild src/Bermuda/Bermuda.csproj -t:PublishNativeApps -p:Configuration=Release -p:NativeAppsPublishDir=${{ github.workspace }}/artifacts/publish/

      - name: Upload self-contained app
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: bermuda-publish-win-x64
          path: artifacts/publish
          retention-days: 1

      # fdc3-preload.js is committed (the host builds without Node), so make
      # sure it matches src/Bermuda.Web/src/fdc3.
      - name: Check committed FDC3 preload is up to date
        run: git diff --ignore-cr-at-eol --exit-code -- src/Bermuda/Preload

      # The FDC3 contract is generated from src/Bermuda.Fdc3.Proto/Protos/fdc3.proto by the build
      # (Bermuda.Fdc3.Proto); the outputs are committed, so a stale or hand-edited copy fails here.
      - name: Check committed FDC3 generated code is up to date
        run: git diff --ignore-cr-at-eol --exit-code -- src/Bermuda.IpcContract/Generated src/Bermuda.Fdc3.Grpc/Generated

  # ─── E2E (requires a Windows desktop runner) ──────────────────────────────
  #
  # The Playwright tests connect to the live app via CDP (port 9222).
  # The WPF host must render a real window, which requires an interactive
  # desktop session — use a self-hosted runner on a Windows 10/11 machine
  # with the WebView2 Runtime and .NET 10 installed.
  #
  # To register a self-hosted runner:
  #   https://docs.github.com/en/actions/hosting-your-own-runners
  e2e:
    name: E2E tests
    needs: build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        # This runner is a signed-in user account and cannot write to Program Files.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install frontend deps
        working-directory: src/Bermuda.Web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: src/Bermuda.Web
        run: pnpm exec playwright install chromium

      - name: Run E2E tests
        working-directory: src/Bermuda.Web
        run: pnpm e2e --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/Bermuda.Web/playwright-report/
          retention-days: 7

  # ─── MSIX publish (runs only on version tags: v1.2.3.4) ───────────────────
  publish:
    name: Publish MSIX
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Repo default token is contents: read. Creating a release and generating its notes
    # call the releases API, which requires contents: write.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download self-contained app
        uses: actions/download-artifact@v4
        with:
          name: bermuda-publish-win-x64
          path: artifacts/publish

      # Derive MSIX version from tag (strips leading 'v')
      - name: Derive MSIX version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # Where the landing page, .appinstaller and .cer are served from. Defaults to the repo's
      # github.io address; set the PAGES_BASE_URL repository variable for a custom domain.
      - name: Resolve site URL
        id: site
        shell: pwsh
        run: |
          $base = "${{ vars.PAGES_BASE_URL }}"
          if (-not $base) { $base = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" }
          echo "url=$($base.TrimEnd('/'))" >> $env:GITHUB_OUTPUT

      - name: Install winapp CLI
        shell: pwsh
        run: |
          winget install Microsoft.winappcli --source winget --accept-package-agreements --accept-source-agreements
          # winget updates PATH for new shells only; expose it to the following steps
          $winapp = (Get-Command winapp -ErrorAction SilentlyContinue)?.Source
          if (-not $winapp) {
            $winapp = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Links\winapp.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $winapp) { throw "winapp not found after install" }
          Split-Path $winapp | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Write signing certificate
        if: env.MSIX_CERT_BASE64 != ''
        env:
          MSIX_CERT_BASE64: ${{ secrets.MSIX_CERT_BASE64 }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_CERT_BASE64))
          echo "MSIX_CERT_PATH=$pfxPath" >> $env:GITHUB_ENV

      - name: Create MSIX
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $args = @(
            "src/Bermuda",
            # dotnet msbuild does not restore. Packing still loads the project, which needs project.assets.json.
            "-restore",
            "-t:CreateMsix",
            "-p:Configuration=Release",
            "-p:MsixInputDir=${{ github.workspace }}/artifacts/publish",
            "-p:MsixVersion=${{ steps.ver.outputs.version }}",
            # The .appinstaller is served from Pages (always the latest release); each MSIX stays at its own tag's release.
            "-p:MsixUrl=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Bermuda_${{ steps.ver.outputs.version }}_x64.msix",
            "-p:AppInstallerUrl=${{ steps.site.outputs.url }}/Bermuda.appinstaller"
          )
          if ($env:MSIX_CERT_PATH) {
            $args += "-p:MsixSigningCert=$env:MSIX_CERT_PATH"
            $args += "-p:MsixSigningCertPassword=$env:MSIX_CERT_PASSWORD"
          }
          dotnet msbuild @args

      # Public half of the signing cert. Users trust it once (Trusted People) before
      # installing from the .appinstaller; the PFX itself never leaves the secrets.
      - name: Export public certificate
        if: env.MSIX_CERT_PATH != ''
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($env:MSIX_CERT_PATH, $env:MSIX_CERT_PASSWORD)
          [IO.File]::WriteAllBytes("artifacts/msix/Bermuda.cer", $cert.Export('Cert'))

      # Landing page + .appinstaller + .cer. The MSIX is too big for Pages and stays on the release.
      - name: Assemble site
        shell: pwsh
        run: >
          ./.github/pages/build-site.ps1
          -OutDir site
          -SourceDir artifacts/msix
          -Version "${{ steps.ver.outputs.version }}"
          -AppInstallerUrl "${{ steps.site.outputs.url }}/Bermuda.appinstaller"
          -MsixUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Bermuda_${{ steps.ver.outputs.version }}_x64.msix"
          -ReleaseUrl "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bermuda-msix-${{ steps.ver.outputs.version }}
          path: |
            artifacts/msix/*.msix
            artifacts/msix/Bermuda.appinstaller
            artifacts/msix/Bermuda.cer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/msix/*.msix
            artifacts/msix/Bermuda.appinstaller
            artifacts/msix/Bermuda.cer
          generate_release_notes: true

  # ─── GitHub Pages (landing page, .appinstaller, .cer) ─────────────────────
  # Needs Pages enabled with "GitHub Actions" as the source, and the github-pages
  # environment must allow deployments from v* tags (Settings → Environments).
  pages:
    name: Deploy site to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
